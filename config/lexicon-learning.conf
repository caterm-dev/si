# Full-Pinyin lookup index in the destination lexicon.
pinyin_index = 0

# A raw gram count strictly above this value bypasses the per-order thresholds.
# Omit this setting to disable the high-count rule.
force_count = 2000000

# Both thresholds apply. Prefix share is a whole percentage from 0 to 100.
# For each order, it is the share of the same-length grams with the same
# prefix of one fewer character. A threshold of 0 disables the share check.
min_count_2 = 1000000
min_prefix_percent_2 = 50

min_count_3 = 500000
min_prefix_percent_3 = 50

min_count_4 = 250000
min_prefix_percent_4 = 50
