# Base corpus and user word-gram imports count orders 2 through max_order.
# Editing max_order applies to future batches. Values may range from 2 to 5.
# Learning thresholds apply to pairs of Han tokens. A zero association
# threshold disables that check.

[base]
max_order = 3
pinyin_index = 0
min_count_2 = 40000
min_forward_percent_2 = 4
min_backward_percent_2 = 4
min_lift_2 = 10

[user]
max_order = 5
pinyin_index = 0
min_count_2 = 5
min_forward_percent_2 = 30
min_backward_percent_2 = 30
min_lift_2 = 2
