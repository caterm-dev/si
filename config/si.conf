# Engine tuning defaults are embedded at Rust build time. Rebuild/reinstall SI after edits.
# Explicit configurations reject out-of-range values; values are never silently clamped.
# Limits bound resource use, but do not guarantee a host latency target.

[field_context]
# Maximum committed text requested before the caret, in UTF-16 units. Integer range: 1..4096.
preceding_text_utf16_limit = 96
# Maximum distinct terminal histories retained for preceding-text scoring. Integer range: 1..16.
segmentation_history_limit = 3
# Temperature for normalized segmentation-path probabilities. Finite range: 0.125..32.
segmentation_temperature = 4

[local_model_ranking]
# Multiplier applied to model score differences in bits (lambda). Finite range: 0..4.
model_score_weight = 0.8
# Maximum model gap before weighting (C), in bits. Finite range: 0..32.
model_score_gap_limit_bits = 8
# Maximum whole-input candidates scored by the model. Integer range: 1..64.
model_candidate_limit = 12
# Maximum trailing context tokens sent to the model. Integer range: 0..128.
model_context_token_limit = 16
# Maximum model tokens in a scored candidate. Integer range: 1..64.
model_candidate_token_limit = 12

[statistical_scoring]
# Maximum reward for an observed sentence opening, in bits. Finite range: 0..8.
sentence_start_reward_limit_bits = 2
# Prior mass controlling base word-gram smoothing. Finite range: 0.001..1000000.
base_word_gram_prior_count = 32
# Prior mass controlling user word-gram boosts. Finite range: 0.001..1000000.
user_word_gram_prior_count = 8
# Maximum word-gram weight; retain at least 20% lower-order evidence. Finite range: 0..0.8.
word_gram_interpolation_weight_limit = 0.8
# Prior mass controlling user unigram boosts. Finite range: 0.001..1000000.
user_unigram_prior_count = 32
# Maximum user unigram boost weight. Finite range: 0..0.8.
user_unigram_boost_weight_limit = 0.8

[spelling_scoring]
# Fixed cost for an incomplete word, in bits. Finite range: 0..64.
completion_base_cost_bits = 4
# Additional cost per missing spelling unit, in bits. Finite range: 0..16.
completion_missing_letter_cost_bits = 1
# Cost for an abbreviated Pinyin match, in bits. Finite range: 0..64.
pinyin_abbreviation_cost_bits = 7

[pinyin_correction]
# Cost for restoring a missing key, in bits; must stay positive. Finite range: 0.125..64.
missing_key_correction_cost_bits = 8
# Cost for swapping adjacent keys, in bits; must stay positive. Finite range: 0.125..64.
adjacent_swap_correction_cost_bits = 8
# Cost for replacing a neighboring key, in bits; must stay positive. Finite range: 0.125..64.
neighbor_key_correction_cost_bits = 11
# Required lead over exact candidates in conservative mode, in bits. Finite range: 0..32.
conservative_correction_minimum_lead_bits = 2
# Required lead in higher-recall mode; cannot exceed conservative lead. Finite range: 0..32.
higher_recall_correction_minimum_lead_bits = 0
# Maximum preceding-context penalty in higher-recall correction, in bits. Finite range: 0..32.
higher_recall_context_backoff_cost_bits = 2

[candidate_search]
# Paths per full-search beam; larger values explore more paths. Integer range: 1..64.
full_search_beam_width = 24
# Paths per preview beam; cannot exceed full_search_beam_width. Integer range: 1..64.
preview_search_beam_width = 6
# Paths per correction beam. Integer range: 1..64.
correction_search_beam_width = 4
# Maximum missing spelling units for ordinary dictionary completion. Integer range: 0..32.
completion_missing_letter_limit = 8
# Maximum direct whole-input completions retained per language. Integer range: 1..128.
direct_completion_limit_per_language = 32

# Corpus imports count orders 2 through max_order (2..5), for future batches only.
# Learning thresholds apply to Han token pairs; zero association thresholds disable checks.
[base]
max_order = 3
pinyin_index = 0
min_count_2 = 40000
min_forward_percent_2 = 4
min_backward_percent_2 = 4
min_lift_2 = 10

[user]
max_order = 5
pinyin_index = 0
min_count_2 = 5
min_forward_percent_2 = 30
min_backward_percent_2 = 30
min_lift_2 = 2
