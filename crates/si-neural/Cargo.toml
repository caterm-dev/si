[package]
name = "si-neural"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Local CPU inference for SI's candidate generation and ranking models"
publish = false

[features]
default = ["pinyin-generation"]
pinyin-generation = []
portable-matmul = []

[[bin]]
name = "si-neural"
required-features = ["pinyin-generation"]

[dependencies]
serde_json = "=1.0.151"
