name: Vocabulary upstream audit

on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocabulary-upstream-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate checked-in vocabulary and maintenance tools
        run: |
          python3 -m unittest discover -s Tests/VocabularyTests -v
          ./scripts/vocabulary.sh build --check
          ./scripts/vocabulary.sh --language chinese build --check
      - name: Check upstream revisions without changing vocabulary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/vocabulary.sh audit --report .build/vocabulary-english-audit.json
          ./scripts/vocabulary.sh --language chinese audit --report .build/vocabulary-chinese-audit.json
      - name: Add audit to job summary
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for language in ['english', 'chinese']:
                  report = json.loads(Path(f'.build/vocabulary-{language}-audit.json').read_text())
                  summary.write(f"### {language.title()} vocabulary\n\n")
                  for source in report['sources']:
                      status = 'Update available' if source['update_available'] else 'Up to date'
                      summary.write(f"- {source['source']}: {status}. [Compare revisions]({source['compare_url']}).\n")
                      if source['update_available']:
                          summary.write(f"\nRefresh after reviewing the source: `{source['refresh_command']}`\n\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vocabulary-upstream-audits
          path: .build/vocabulary-*-audit.json
