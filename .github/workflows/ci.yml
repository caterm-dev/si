name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Core tests and macOS build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate shared Chinese and English dictionaries
        run: |
          python3 -m unittest discover -s Tests/VocabularyTests -v
          python3 scripts/msime_dictionary.py build --check
          python3 scripts/english_dictionary.py build --check
          ./scripts/vocabulary.sh build --check
          python3 scripts/ranking.py --check
      - name: Test shared core
        run: ./scripts/test.sh
      - name: Build input method
        run: ./scripts/build.sh Release
