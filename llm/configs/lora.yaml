# Conservative starting settings, not a measured memory/performance promise.
# Model, data and adapter paths are supplied by experiment.py.
fine_tune_type: lora
num_layers: 4
batch_size: 1
grad_accumulation_steps: 4
iters: 100
learning_rate: 0.00005
max_seq_length: 1024
grad_checkpoint: true
mask_prompt: true
val_batches: 4
steps_per_report: 10
steps_per_eval: 25
save_every: 25
seed: 42
report_to: null
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.0
